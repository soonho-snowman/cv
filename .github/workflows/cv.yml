# Builds cv.tex (synced from Overleaf) with XeLaTeX and publishes the PDF with GitHub Pages.
# Live at https://soonho-snowman.github.io/cv/ (and kwonsoonho.com/cv/ once the domain is connected).

name: Build CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CV loads fontenc T1 after Roboto; switch body text to XeLaTeX's TU encoding
      # so Roboto is used as on Overleaf. cv.tex itself is not changed.
      - name: Wrap cv.tex for the build
        run: |
          printf '%s\n' '\AtBeginDocument{\renewcommand{\encodingdefault}{TU}\fontencoding{TU}\selectfont}' '\input{cv}' > ci-cv.tex

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: ci-cv.tex
          latexmk_use_xelatex: true
          texlive_version: 2020

      - name: Prepare site
        run: |
          mkdir -p _site
          cp ci-cv.pdf _site/cv.pdf
          cp ci-cv.pdf _site/Soonho_Kwon_CV.pdf
          echo '<!doctype html><meta charset="utf-8"><title>Soonho Kwon - CV</title><meta http-equiv="refresh" content="0; url=cv.pdf"><a href="cv.pdf">CV (PDF)</a>' > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
